name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare embedded backend project files
        shell: bash
        run: |
          set -e
          python3 <<'PY2'
          from pathlib import Path
          import base64
          import json

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data.setdefault('dependencies', {})['@capawesome/capacitor-nodejs'] = '^0.1.1'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          files = {
              'src/lib/localBackend.ts': '',
              'scripts/prepare-mobile-backend.mjs': '',
          }

          for path, encoded in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          config = Path('capacitor.config.ts')
          text = config.read_text(encoding='utf-8')
          if '@capawesome/capacitor-nodejs' not in text.splitlines()[0]:
              text = '/// <reference types="@capawesome/capacitor-nodejs" />\n' + text
          if "Nodejs: {" not in text:
              text = text.replace(
                  "  plugins: {\n",
                  "  plugins: {\n    Nodejs: {\n      nodeDir: 'nodejs',\n      startMode: 'auto',\n    },\n",
                  1,
              )
          config.write_text(text, encoding='utf-8')

          main = Path('src/main.tsx')
          text = main.read_text(encoding='utf-8')
          import_line = "import { setupLocalBackend } from './lib/localBackend.ts';"
          if import_line not in text:
              text = text.replace(
                  "import { ErrorBoundary } from './components/ErrorBoundary.tsx';",
                  "import { ErrorBoundary } from './components/ErrorBoundary.tsx';\n" + import_line,
                  1,
              )
          if 'setupLocalBackend();' not in text:
              text = text.replace(
                  "createRoot(document.getElementById('root')!).render(",
                  "setupLocalBackend();\n\ncreateRoot(document.getElementById('root')!).render(",
                  1,
              )
          main.write_text(text, encoding='utf-8')
          PY2

      - name: Install dependencies
        run: npm install

      - name: Prepare embedded Node backend
        shell: bash
        run: |
          set -e
          node scripts/prepare-mobile-backend.mjs
          mkdir -p public/nodejs

          npx esbuild server.mobile.ts \
            --platform=node \
            --format=cjs \
            --target=node18 \
            --packages=external \
            --outfile=public/nodejs/server.cjs

          cat > public/nodejs/index.js <<'EOF2'
          process.env.NODE_ENV = 'production';
          process.env.CAPACITOR_NODEJS = '1';
          require('./server.cjs');
          EOF2

          cat > public/nodejs/package.json <<'EOF2'
          {
            "name": "aiphone-mobile-backend",
            "version": "1.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "dotenv": "^17.2.3",
              "express": "^4.21.2"
            }
          }
          EOF2

      - name: Build web app
        run: npm run build

      - name: Install embedded backend runtime dependencies
        working-directory: dist/nodejs
        run: npm install --omit=dev --ignore-scripts

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       真正的编译错误在这里"
          echo "========================================"
          grep -n -A 30 -B 10 "What went wrong" ../build.log || true

          echo ""
          echo "========================================"
          echo "       任务失败信息"
          echo "========================================"
          grep -n -A 10 -B 5 "FAILURE:" ../build.log || true
          grep -n -A 10 -B 5 "Execution failed" ../build.log || true

          exit $STATUS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshouji-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
