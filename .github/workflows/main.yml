name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       真正的编译错误在这里"
          echo "========================================"

          grep -n -A 30 -B 10 "What went wrong" ../build.log || true

          echo ""
          echo "========================================"
          echo "       任务失败信息"
          echo "========================================"

          grep -n -A 10 -B 5 "FAILURE:" ../build.log || true
          grep -n -A 10 -B 5 "Execution failed" ../build.log || true

          exit $STATUS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshouji-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
