name: Build Full Xiaoshouji APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Signing Secrets & Setup Build Environment
        shell: bash
        run: |
          set -e

          KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more required keystore secrets are missing!"
            echo "Missing check:"
            [ -z "$KEYSTORE_BASE64" ] && echo " - ANDROID_KEYSTORE_BASE64 is empty"
            [ -z "$KEYSTORE_PASSWORD" ] && echo " - ANDROID_KEYSTORE_PASSWORD is empty"
            [ -z "$KEY_ALIAS" ] && echo " - ANDROID_KEY_ALIAS is empty"
            [ -z "$KEY_PASSWORD" ] && echo " - ANDROID_KEY_PASSWORD is empty"
            echo "Building without fixed signing is strictly disallowed. Aborting build."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/xiaoshouji-signing.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Failed to decode ANDROID_KEYSTORE_BASE64 or output keystore is empty!"
            exit 1
          fi

          BUILD_CODE=$(( ${{ github.run_number }} + 1 ))
          BUILD_NAME="1.1.${BUILD_CODE}"

          echo "BUILD_CODE=${BUILD_CODE}" >> $GITHUB_ENV
          echo "BUILD_NAME=${BUILD_NAME}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION_CODE=${BUILD_CODE}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION_NAME=${BUILD_NAME}" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV

          echo "Successfully configured fixed signing keystore and build version ${BUILD_NAME} (${BUILD_CODE})."

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npx vite build

      - name: Build embedded backend
        run: npm run build:mobile-backend

      - name: Verify embedded backend
        shell: bash
        run: |
          echo "====== Embedded backend ======"
          ls -lah dist/nodejs
          test -s dist/nodejs/package.json
          test -s dist/nodejs/index.cjs
          test -s dist/nodejs/server.cjs

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android Node.js integration
        shell: bash
        run: |
          echo "====== Capacitor plugins ======"
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -qi "nodejs" android/app/src/main/assets/capacitor.plugins.json
          echo "====== Node project copied to Android assets ======"
          test -s android/app/src/main/assets/public/nodejs/package.json
          test -s android/app/src/main/assets/public/nodejs/index.cjs
          test -s android/app/src/main/assets/public/nodejs/server.cjs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug -PversionCode=${BUILD_CODE} -PversionName="${BUILD_NAME}" --stacktrace --console=plain

      - name: Verify APK
        shell: bash
        run: |
          echo "====== APK files ======"
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshouji-full-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
